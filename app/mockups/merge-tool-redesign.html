<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NGL Mockup — Merge Tool Redesign v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc; color: #0f172a; font-size: 14px;
  }

  /* ─── Mockup banner ─── */
  .mockup-banner {
    background: linear-gradient(90deg, #ea580c, #f97316);
    color: white; padding: 9px 24px;
    font-size: 0.8rem; font-weight: 600;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .mockup-banner .pill {
    background: rgba(255,255,255,0.2);
    padding: 2px 8px; border-radius: 4px;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .state-toggle {
    margin-left: auto; display: flex; gap: 4px;
    background: rgba(0,0,0,0.15); padding: 3px; border-radius: 8px;
  }
  .state-toggle button {
    padding: 5px 14px; border: none; background: none;
    color: rgba(255,255,255,0.85);
    font-size: 0.76rem; font-weight: 600; cursor: pointer;
    border-radius: 5px; font-family: inherit;
  }
  .state-toggle button:hover { color: white; }
  .state-toggle button.active { background: white; color: #ea580c; }

  /* ─── App layout ─── */
  .app-layout { display: flex; min-height: calc(100vh - 38px); }

  .sidebar {
    width: 200px; min-width: 200px; background: #fff;
    border-right: 1px solid #e2e8f0;
    display: flex; flex-direction: column;
    height: calc(100vh - 38px); position: sticky; top: 38px;
  }
  .sidebar-logo {
    padding: 16px 14px 14px; text-align: center;
    border-bottom: 1px solid #f1f5f9;
  }
  .sidebar-logo .logo-mark {
    width: 48px; height: 48px;
    background: #0f172a; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
  }
  .sidebar-logo .logo-title { font-size: 0.78rem; font-weight: 700; color: #0f172a; }
  .sidebar-logo .logo-subtitle { font-size: 0.65rem; color: #94a3b8; margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-section-label {
    font-size: 0.62rem; font-weight: 700; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 14px 11px 5px;
  }
  .sidebar-nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; border-radius: 7px; cursor: pointer;
    color: #475569; font-size: 0.82rem; font-weight: 500;
    border: 1px solid transparent;
  }
  .sidebar-nav-item:hover { background: #f8fafc; color: #1e293b; }
  .sidebar-nav-item.active {
    background: #fff7ed; color: #ea580c; font-weight: 600;
    border-color: #fed7aa;
  }
  .sidebar-footer { padding: 10px 14px; border-top: 1px solid #f1f5f9; font-size: 0.7rem; color: #94a3b8; text-align: center; }

  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .tool-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid #e2e8f0; background: #fff;
  }
  .tool-title-group { display: flex; align-items: center; gap: 12px; }
  .tool-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
  .tool-title-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: #fff7ed; color: #ea580c;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-actions { display: flex; align-items: center; gap: 10px; }
  .tool-switcher-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; border: 1px solid #e2e8f0;
    background: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 500;
    color: #475569; font-family: inherit;
  }
  .agent-indicator {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: #f0fdf4; border: 1px solid #bbf7d0;
    font-size: 0.78rem; color: #15803d; font-weight: 500;
  }
  .agent-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #16a34a; box-shadow: 0 0 6px rgba(22,163,106,0.5);
  }

  .work-area { padding: 24px 28px; overflow-y: auto; flex: 1; }

  /* ════════════════════════════════════════════════
     CENTERED STAGE (used in Empty / Loading / Excel-Loaded / Done)
     One canonical drop-zone size — never shrinks between steps.
     ════════════════════════════════════════════════ */
  .centered-stage {
    display: flex; flex-direction: column; align-items: center;
    max-width: 620px; margin: 0 auto;
  }
  .centered-stage h1 {
    font-size: 1.4rem; font-weight: 700; color: #0f172a;
    margin-bottom: 6px; text-align: center;
  }
  .centered-stage .subtitle {
    color: #64748b; font-size: 0.92rem;
    margin-bottom: 22px; text-align: center;
  }

  /* The canonical "big drop" — same dimensions every time it appears */
  .big-drop {
    width: 100%; padding: 48px 32px;
    border: 2px dashed #cbd5e1; border-radius: 14px;
    background: #fff; text-align: center; cursor: pointer;
    transition: all 0.15s;
  }
  .big-drop:hover { border-color: #f97316; background: #fff7ed; }
  .big-drop.kind-excel:hover .drop-icon { color: #16a34a; }
  .big-drop.kind-pdf .drop-icon { color: #ea580c; }
  .big-drop .drop-icon {
    width: 56px; height: 56px; margin: 0 auto 16px;
    color: #22c55e;
    display: flex; align-items: center; justify-content: center;
  }
  .big-drop .drop-title { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
  .big-drop .drop-help { font-size: 0.86rem; color: #64748b; margin-top: 6px; }
  .big-drop .drop-types { font-size: 0.76rem; color: #94a3b8; margin-top: 14px; }

  /* Hint chip below the drop zone (e.g., "Step 2 — drop PDFs next") */
  .hint-chip {
    margin-top: 18px; text-align: center;
    color: #94a3b8; font-size: 0.84rem;
  }
  .hint-chip .step-num {
    display: inline-block; width: 18px; height: 18px;
    background: #f1f5f9; border-radius: 50%;
    color: #64748b; font-weight: 700; font-size: 0.7rem;
    line-height: 18px; margin-right: 6px;
  }

  /* File summary chip stacked above a centered drop zone */
  .stage-file-summary {
    width: 100%; margin-bottom: 16px;
  }

  /* ════════════════════════════════════════════════
     REVIEW state — validation card after Excel parsed
     ════════════════════════════════════════════════ */
  .review-card {
    width: 100%;
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 12px; padding: 22px 24px;
    margin-bottom: 18px;
  }
  .review-card.has-issues { border-color: #fde68a; background: #fffbeb; }
  .review-card.all-clear  { border-color: #bbf7d0; background: #f0fdf4; }
  .review-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .review-head .badge {
    width: 36px; height: 36px; border-radius: 50%;
    color: white; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem;
  }
  .review-head .badge.warn { background: #f59e0b; }
  .review-head .badge.ok   { background: #16a34a; }
  .review-head h3 {
    font-size: 1.02rem; font-weight: 700; color: #0f172a;
  }
  .review-head .sub {
    font-size: 0.84rem; color: #64748b; margin-top: 2px;
  }

  .issue-group { margin-bottom: 14px; }
  .issue-group:last-child { margin-bottom: 0; }
  .issue-group .igh {
    font-size: 0.74rem; font-weight: 700; color: #92400e;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .issue-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; background: #fff;
    border: 1px solid #fde68a; border-radius: 7px;
    font-size: 0.84rem; color: #78350f;
    margin-bottom: 5px;
  }
  .issue-row:last-child { margin-bottom: 0; }
  .issue-row .ref {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 0.78rem; color: #92400e; font-weight: 600;
    background: #fef3c7; padding: 2px 7px; border-radius: 4px;
  }
  .issue-row .where {
    margin-left: auto; font-size: 0.76rem; color: #b45309;
  }

  .review-actions {
    display: flex; gap: 10px; align-items: center;
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid #fde68a;
  }
  .review-card.all-clear .review-actions { border-top-color: #bbf7d0; }
  .review-actions .secondary-btn {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 9px 16px;
    font-size: 0.85rem; font-weight: 600; color: #475569;
    cursor: pointer; font-family: inherit;
  }
  .review-actions .secondary-btn:hover { border-color: #cbd5e1; color: #1e293b; }

  /* ════════════════════════════════════════════════
     PDF drop card in top-bar (Fetching / Ready / Merging / Done)
     Same dashed border style, sized to live in the top bar.
     ════════════════════════════════════════════════ */
  .pdf-drop-card {
    background: #fff; border: 2px dashed #cbd5e1;
    border-radius: 10px; padding: 12px 16px;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 12px;
  }
  .pdf-drop-card:hover { border-color: #f97316; background: #fff7ed; }
  .pdf-drop-card.has-failures {
    border-color: #f59e0b; background: #fffbeb;
  }
  .pdf-drop-card.has-failures:hover { background: #fef3c7; }
  .pdf-drop-card .icon-box {
    width: 36px; height: 36px; border-radius: 8px;
    background: #fff7ed; color: #ea580c;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pdf-drop-card .text { flex: 1; min-width: 0; }
  .pdf-drop-card .label-line {
    font-weight: 600; color: #1e293b; font-size: 0.86rem;
    display: flex; align-items: center; gap: 8px;
  }
  .pdf-drop-card .label-line .count-pill {
    background: #ea580c; color: white;
    padding: 1px 8px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700;
  }
  .pdf-drop-card .help { color: #64748b; font-size: 0.76rem; margin-top: 2px; }
  .pdf-drop-card.has-failures .help { color: #b45309; }

  /* ════════════════════════════════════════════════
     PRE-FETCH validation badge (in Review state)
     ════════════════════════════════════════════════ */
  .val-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 5px;
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .val-badge.ok    { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .val-badge.dup   { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .val-badge.miss  { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
  .val-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .val-badge.ok .dot { background: #16a34a; }
  .val-badge.dup .dot { background: #f59e0b; }
  .val-badge.miss .dot { background: #dc2626; }

  /* Top-right action button next to the tabs */
  .top-action-btn {
    padding: 9px 18px; background: #ea580c; color: white;
    border: none; border-radius: 8px; font-weight: 700;
    font-size: 0.86rem; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .top-action-btn:hover { background: #c2410c; }
  .top-action-btn.disabled, .top-action-btn:disabled {
    background: #fed7aa; cursor: not-allowed;
  }

  /* ════════════════════════════════════════════════
     DETAIL SIDEBAR — slides in from right when a row is clicked.
     Pattern matches the Invoice Sender review modal but as a sidebar.
     ════════════════════════════════════════════════ */
  .sidebar-backdrop {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.35);
    z-index: 200;
    display: none;
  }
  .sidebar-backdrop.open { display: block; }

  .detail-sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 520px; max-width: 90vw;
    background: #fff;
    border-left: 1px solid #e2e8f0;
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    z-index: 201;
    display: none;
    flex-direction: column;
  }
  .detail-sidebar.open { display: flex; }

  .ds-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #e2e8f0;
    background: #f8fafc;
    flex-shrink: 0;
  }
  .ds-header .ds-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: #fef2f2; color: #dc2626;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ds-header .ds-title { font-size: 1rem; font-weight: 700; color: #0f172a; }
  .ds-header .ds-subtitle {
    font-size: 0.8rem; color: #64748b; margin-top: 2px;
    font-family: 'SF Mono', Consolas, monospace;
  }
  .ds-header .ds-close {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: #94a3b8; padding: 6px; border-radius: 6px;
  }
  .ds-header .ds-close:hover { color: #1e293b; background: #fff; }

  .ds-body {
    flex: 1; overflow-y: auto;
    padding: 20px;
  }
  .ds-section {
    margin-bottom: 22px;
  }
  .ds-section:last-child { margin-bottom: 0; }
  .ds-section-label {
    font-size: 0.72rem; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  /* "What we found" doc list */
  .ds-doc-list { display: flex; flex-direction: column; gap: 6px; }
  .ds-doc-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    font-size: 0.84rem;
  }
  .ds-doc-row.found { background: #f0fdf4; border-color: #bbf7d0; }
  .ds-doc-row.miss { background: #fef2f2; border-color: #fca5a5; }
  .ds-doc-row .ds-doc-label { font-weight: 700; min-width: 50px; }
  .ds-doc-row.found .ds-doc-label { color: #15803d; }
  .ds-doc-row.miss .ds-doc-label { color: #b91c1c; }
  .ds-doc-row .ds-doc-name {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 0.78rem; color: #475569;
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ds-doc-row.miss .ds-doc-name { color: #b91c1c; font-style: italic; }
  .ds-doc-row .ds-doc-action {
    background: #fff; border: 1px solid #e2e8f0;
    padding: 4px 10px; border-radius: 5px;
    font-size: 0.74rem; cursor: pointer; color: #475569;
    font-family: inherit;
  }
  .ds-doc-row .ds-doc-action:hover { border-color: #ea580c; color: #ea580c; }

  /* Retry API call button (sidebar primary action) */
  .retry-api-btn {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px;
    background: #ea580c; color: white;
    border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.88rem; font-weight: 700;
    cursor: pointer;
  }
  .retry-api-btn:hover { background: #c2410c; }

  .resolve-divider {
    text-align: center; margin: 14px 0;
    font-size: 0.74rem; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.06em;
    position: relative;
  }
  .resolve-divider::before, .resolve-divider::after {
    content: ''; position: absolute; top: 50%;
    width: calc(50% - 60px); height: 1px;
    background: #e2e8f0;
  }
  .resolve-divider::before { left: 0; }
  .resolve-divider::after { right: 0; }
  .resolve-divider span {
    background: #fff; padding: 0 8px;
    position: relative;
  }

  /* Upload zone in sidebar */
  .ds-upload {
    border: 2px dashed #fca5a5;
    border-radius: 10px;
    background: #fef2f2;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ds-upload:hover { border-color: #dc2626; background: #fee2e2; }
  .ds-upload .icon {
    width: 36px; height: 36px; margin: 0 auto 8px;
    color: #dc2626;
  }
  .ds-upload .title { font-size: 0.9rem; font-weight: 600; color: #b91c1c; }
  .ds-upload .help { font-size: 0.78rem; color: #b91c1c; margin-top: 4px; opacity: 0.85; }

  .ds-footer {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid #e2e8f0;
    background: #f8fafc;
    flex-shrink: 0;
  }
  .ds-footer .skip-link {
    font-size: 0.82rem; color: #64748b; cursor: pointer;
    background: none; border: none; font-family: inherit;
    text-decoration: underline;
  }
  .ds-footer .skip-link:hover { color: #dc2626; }
  .ds-footer .nav-btn {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 7px; padding: 7px 12px;
    font-size: 0.82rem; cursor: pointer; color: #475569;
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ds-footer .nav-btn:hover { border-color: #ea580c; color: #ea580c; }
  .ds-footer .save-btn {
    background: #ea580c; color: white; border: none;
    padding: 9px 18px; border-radius: 7px;
    font-size: 0.84rem; font-weight: 700; cursor: pointer;
    font-family: inherit; margin-left: auto;
  }
  .ds-footer .save-btn:hover { background: #c2410c; }

  /* Failed rows in Ready state are clickable */
  .merge-table tbody tr.row-clickable { cursor: pointer; }
  .merge-table tbody tr.row-clickable:hover { background: #fff7ed; }

  /* ════════════════════════════════════════════════
     LOADING — spinner displayed inside the same .big-drop frame
     so the box doesn't visually shrink between states.
     ════════════════════════════════════════════════ */
  .big-drop.loading { cursor: default; border-style: solid; border-color: #fed7aa; background: #fff7ed; }
  .big-drop.loading:hover { background: #fff7ed; border-color: #fed7aa; }
  .big-drop .big-spinner {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border: 3px solid #fed7aa; border-top-color: #ea580c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ════════════════════════════════════════════════
     TOP BAR — file summary + persistent PDF drop
     ════════════════════════════════════════════════ */
  .top-bar {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 18px;
  }
  .file-summary {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 10px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .file-summary .icon-box {
    width: 36px; height: 36px; border-radius: 8px;
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.7rem; flex-shrink: 0;
  }
  .file-summary .icon-box.xlsx { background: #16a34a; }
  .file-summary .icon-box.pdf  { background: #ea580c; }
  .file-summary .text { flex: 1; min-width: 0; }
  .file-summary .name {
    font-weight: 600; color: #0f172a; font-size: 0.88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-summary .meta { color: #64748b; font-size: 0.76rem; margin-top: 1px; }
  .file-summary button {
    background: none; border: 1px solid #e2e8f0; border-radius: 6px;
    padding: 5px 10px; font-size: 0.74rem; cursor: pointer;
    color: #64748b; font-family: inherit;
  }
  .file-summary button:hover { border-color: #ea580c; color: #ea580c; }

  /* Detected containers preview (between Excel-loaded and PDFs-dropped) */
  .containers-preview {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 10px; padding: 14px 18px;
    font-size: 0.82rem; color: #64748b;
  }
  .containers-preview strong { color: #1e293b; }
  .container-list {
    margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px;
  }
  .container-list .chip {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 0.75rem; color: #475569;
    background: #f1f5f9; padding: 3px 9px; border-radius: 5px;
  }
  .container-list .chip-more { color: #94a3b8; padding: 3px 4px; }

  /* ════════════════════════════════════════════════
     CONTROLS ROW — compact dropdowns
     ════════════════════════════════════════════════ */
  .controls-line {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .dropdown-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 7px;
    font-size: 0.82rem; cursor: pointer; font-family: inherit;
    color: #475569;
  }

<script>
let subMode = 'ready';
let pendingMode = null;
let completedModes = [];        // tracks which merge modes have been run this session
let lastCompletedMode = null;   // for the success banner

const MODE_INFO = {
  'per-container': { name: 'Per Container', mTeaser: '38 PDFs · one per WO',     mDone: '38 PDFs · 312 pages · 24.5 MB', folder: '/Per-Container/'      },
  'all-in-one':    { name: 'All in One',    mTeaser: 'Combine all 38 into one PDF', mDone: '1 PDF · 312 pages · 24.5 MB', folder: '/All-in-One.pdf'      },
  'invoices-only': { name: 'Invoices Only', mTeaser: '38 invoices in one PDF',  mDone: '1 PDF · 38 invoices · 96 pages', folder: '/Invoices-Only.pdf'    },
  'pods-only':     { name: 'PODs Only',     mTeaser: '36 PODs in one PDF',      mDone: '1 PDF · 36 PODs · 184 pages',    folder: '/PODs-Only.pdf'        },
  'bls-only':      { name: 'BLs Only',      mTeaser: 'BLs in one PDF',          mDone: '1 PDF · 12 BLs · 32 pages',      folder: '/BLs-Only.pdf'         },
};

function startMerge(mode) {
  pendingMode = mode;
  setState('merging');
}

const STATE_GROUP = {
  empty: 's1', loading: 's1',
  review: 's2', fetching: 's2',
  ready: 's3',
  merging: 's4', done: 's4',
};

const STATES = {
  s1: () => subMode === 'loading' ? renderLoading() : renderEmpty(),
  s2: () => subMode === 'fetching' ? renderFetching() : renderReview(),
  s3: () => renderReady(),
  s4: () => subMode === 'merging' ? renderMerging() : renderDone(),
};

// ─── State 1: Empty + Loading ──────────────────────
function renderEmpty() {
  return `
    <div class="centered-stage">
      <h1>Start a new merge</h1>
      <p class="subtitle">Upload your Excel manifest first — we'll match PDFs to it next.</p>
      <div class="big-drop kind-excel" onclick="setState('loading')">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>
          </svg>

          <button class="retry-api-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Retry API call
          </button>
          <div class="resolve-divider"><span>or upload manually</span></div>
          <div class="ds-upload">
            <div class="icon">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="title">Drop POD for TCLU8830712</div>
            <div class="help">.pdf only — replaces whatever the API would have returned</div>
          </div>
        </div>
      </div>

      <div class="ds-footer">
        <button class="skip-link">Skip this container</button>
        <button class="nav-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <button class="nav-btn">
          Next
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="save-btn">Save & Resolve</button>
      </div>
    </div>
  `;
}

function openSidebar(c) {
  const sb = document.getElementById('detailSidebar');
  const bd = document.querySelector('.sidebar-backdrop');
  if (sb) sb.classList.add('open');
  if (bd) bd.classList.add('open');
}
function closeSidebar() {
  const sb = document.getElementById('detailSidebar');
  const bd = document.querySelector('.sidebar-backdrop');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('open');
}

// Outputs viewer (Done state) — dynamic based on completedModes
function outputsMarkup() {
  const rows = Object.entries(MODE_INFO).map(([key, info]) => {
    const isDone = completedModes.includes(key);
    if (isDone) {
      return `
        <div class="output-row done">
          <div class="output-info">
            <div class="output-name">${info.name}</div>
            <div class="output-meta">${info.mDone} · saved to <span style="font-family:'SF Mono',Consolas,monospace;">${info.folder}</span></div>
          </div>
          <div class="output-actions">
            <button class="output-action" title="Reopen output folder in Explorer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              Open Folder
            </button>
            <button class="output-action">${key === 'per-container' ? 'View List (38)' : 'View'}</button>
          </div>
        </div>`;
    }
    return `
      <div class="output-row pending" onclick="startMerge('${key}')">
        <div class="output-info">
          <div class="output-name">${info.name}</div>
          <div class="output-meta">${info.mTeaser}</div>
        </div>
        <button class="output-action primary" onclick="event.stopPropagation(); startMerge('${key}')">Run This Merge</button>
      </div>`;
  }).join('');

  const help = completedModes.length === 0
    ? 'No merges run yet. Click any output to produce one — run as many as you want.'
    : completedModes.length === 5
      ? 'All 5 outputs produced. Open any folder above or use the top-bar drop card to add more PDFs and re-run.'
      : `${completedModes.length} of 5 outputs produced. Run another mode to add a new output — each saves separately.`;

  return `
    <div class="outputs-card">
      <div class="section-label" style="margin-bottom:6px;">Outputs</div>
      <p class="merge-modes-help">${help}</p>
      ${rows}
    </div>
  `;
}

// State manager
function setState(name) {
  // When arriving at Done from a merge, mark the pending mode as completed
  if (name === 'done' && pendingMode) {
    if (!completedModes.includes(pendingMode)) {
      completedModes.push(pendingMode);
    }
    lastCompletedMode = pendingMode;
    pendingMode = null;
  }
  subMode = name;
  const group = STATE_GROUP[name] || name;
  document.querySelectorAll('.state-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.state === group);
  });
  document.getElementById('workArea').innerHTML = STATES[group]();
}

// Seed the demo so Done state shows a realistic post-merge snapshot
completedModes = ['per-container'];
lastCompletedMode = 'per-container';
setState('ready');
</script>
